[versions]
agp = "9.3.0"
junit = "4.13.2"
appcompat = "1.7.1"
material = "1.14.0"
activity = "1.8.0"
coordinatorlayout = "1.3.0"
playServicesMaps = "19.0.0"
orgJson = "20240303"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Android ships org.json on the phone, but the copy unit tests compile against
# is an empty stub. This is the real thing, for tests only.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "coordinatorlayout" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }